# grill-me 的拆解目標。id 格式「來源/元件」：comcot/ 是 COMCOT 原始碼（卡 01 會下載到 lab/vendor/），
# pinn/ 是你在 PINN 卡寫的程式（lab/mine/）。
# files：拷問時要讀的原始碼；lessons：對應的儲備課程；seeds：起始問題（grill-me 會再往下追問，不給答案）。
# 分數 0–3 記在 grill/scores.json：0 答不出、1 能描述它做什麼、2 能解釋為什麼並預測改動後果、3 能不看程式重寫並說出失效情境。
# （專案 A、B 的舊目標隨專案封存在 docs/archive/projects/。）

