# 專案 C 的關卡：由下往上，每一層只有在條件全滿足時才准放程式碼。
# tools/gate.py 檢查：某層 layers/<id>/ 底下若出現 .py 檔，但條件未滿足，CI 失敗。
# 條件：lessons＝課程已出貨；grill＝該目標分數 ≥ 2；below＝下一層測試已通過。

[[layer]]
id = "L1-ade-solver"
title = "一維對流-延散有限差分求解器"
goal = "上風＋隱式延散，與 Ogata–Banks 解析解比較；收斂階、守恆、Péclet 數對數值擴散的影響"
lessons = ["01/01", "01/02", "01/03"]
grill = ["A/conservation-form", "A/analytic-and-convergence", "A/cfl-and-boundaries"]

[[layer]]
id = "L2-inverse-dispersion"
title = "從監測井資料反求延散係數"
goal = "合成觀測加雜訊，以最小平方反求 D；可辨識性（窗長、雜訊）；敏感度"
lessons = ["02/06", "03/01"]
grill = ["A/wet-dry"]
below = "L1-ade-solver"

[[layer]]
id = "L3-well-etl-spatial"
title = "監測井資料 ETL 與空間"
goal = "多來源濃度資料清理、TWD97 座標、羽流範圍多邊形與面積"
lessons = ["04/01", "04/02", "05/01", "05/03", "05/04"]
grill = ["B/etl-time-units", "B/thiessen-and-projection"]
below = "L2-inverse-dispersion"

[[layer]]
id = "L4-service"
title = "模擬與反問題 API"
goal = "非同步工作、輸入驗證、problem+json、冪等"
lessons = ["06/01", "06/02", "06/03", "06/04"]
grill = ["A/job-queue", "A/api-contract"]
below = "L3-well-etl-spatial"

[[layer]]
id = "L5-platform"
title = "自架平台"
goal = "容器、k3d manifest、監控、故障演練"
lessons = ["00/03", "07/01", "07/02", "07/03", "07/04", "07/07"]
grill = ["A/deployment", "B/k8s-and-metrics"]
below = "L4-service"

[[layer]]
id = "L6-decisions"
title = "架構決策與否證案例"
goal = "ADR（儲存、self-host 或外包、FaaS 與否）、10 倍容量估算、否證案例集"
lessons = ["07/05", "07/06", "08/02", "08/03"]
grill = []
below = "L5-platform"
