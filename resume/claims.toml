# 履歷生產表的規則：每一條履歷敘述（claim）要滿足哪些證據才解鎖。
# 由 python tools/resume_gen.py 讀取，產生 resume/generated/ 下的表格與敘述。
#
# requires 可用的條件：
#   grill       grill 目標分數 ≥ 2（grill/scores.json）
#   lessons     課程已出貨（推導＋程式＋測試＋否證）
#   cards       實驗室卡已完成（lab/progress.json）
#   falsification_mine  docs/ai-falsification-log.md 中作者為「我」的筆數下限
#
# {falsification_mine} 會換成筆數。
#
# 誠實原則：實作卡的程式由你自己寫、通過驗收才解鎖，才用「實作」；只跑過 Claude 工具的寫「實驗／評估」。
# （專案 A、B、C 的敘述隨專案封存，2026-11-16 移除。）

[[claim]]
id = "L1-tsunami-sensitivity"
capability = "M1 數值模擬與物理判斷"
requires.cards = ["09", "12", "13", "14"]
zh = "以 COMCOT 淺水方程模式建立台灣海嘯情境實驗：真實地形（ETOPO）、文獻依據的馬尼拉海溝斷層情境，分析地震規模、線性／非線性方程與網格解析度對沿岸最大水位的敏感度。"
en = "Built Taiwan tsunami scenario experiments with the COMCOT shallow-water model using real bathymetry and literature-based Manila Trench sources, and analysed the sensitivity of coastal maximum water level to magnitude, linear vs nonlinear physics and grid resolution."
interview = "網格要多細才夠？你怎麼知道？什麼情況你不信這個模式的結果？"

[[claim]]
id = "L-k8s-observability"
capability = "M2 自架基礎設施"
requires.cards = ["24", "25", "26", "27"]
zh = "將海嘯模擬服務部署到 k3d（資源限制、就緒與存活探針、非 root、固定映像版本），以 Prometheus 指標追蹤完成與失敗的工作，並以刪除 Pod 的故障演練檢驗工作狀態的恢復；以自訂驗收測試審查 AI 產生的 manifest。"
en = "Deployed the tsunami simulation service on k3d (resource limits, readiness/liveness probes, non-root, pinned images), tracked completed and failed jobs with Prometheus metrics, ran pod-kill failure drills on job-state recovery, and reviewed AI-generated manifests against my own acceptance tests."
interview = "replicas 改成 3 時哪裡會出錯？你會對哪個指標設告警？"

[[claim]]
id = "L2-own-verification-tools"
capability = "M1 數值模擬與物理判斷"
requires.cards = ["06", "07", "14"]
zh = "自行以 Python 撰寫海嘯模擬的驗證工具並由自動化驗收測試把關：長波走時（梯形積分，對線性變淺解析解驗證）、水位快照最大值與海岸格後處理、觀測收斂階與 Richardson 外插（非單調時拒絕估計），並與 COMCOT 輸出交叉檢查。"
en = "Wrote, in Python and gated by automated acceptance tests, verification tooling around a tsunami model: long-wave travel time (trapezoidal integration checked against the analytic linear-shoaling solution), snapshot-maximum and shoreline post-processing, and observed-order / Richardson-extrapolation estimates that refuse non-monotone input; cross-checked against COMCOT output."
interview = "你的走時和 COMCOT 差在哪？什麼情況 Richardson 外插不能用？"

[[claim]]
id = "L3-geodata-etl"
capability = "空間資訊與 ETL"
requires.cards = ["08", "10", "15"]
zh = "撰寫空間與時間序列資料前處理並以測試驗收：ETOPO 水深裁切與 COMCOT 格式轉換（NaN 與空範圍拒收、網格順序固定）、TWD97（EPSG:3826）座標轉換與距離（中央經線與軸順序檢查）、潮位站資料清理（時區統一為 UTC、哨兵值與超出範圍、衝突紀錄全數拒收並留下原因）。"
en = "Wrote tested geodata and time-series preprocessing: ETOPO bathymetry cropping into COMCOT format (rejecting NaN and empty extents, fixed grid order), TWD97 (EPSG:3826) conversion and distances (central-meridian and axis-order checks), and tide-gauge cleaning (UTC normalisation, sentinel and range screening, conflicting duplicates rejected with logged reasons)."
interview = "兩筆同站同時刻的數值不同，你為什麼不留其中一筆？"

[[claim]]
id = "L4-service-and-batch"
capability = "M2 自架基礎設施與 REST API"
requires.cards = ["17", "18", "19", "20"]
zh = "將海嘯模擬包成非同步服務並容器化：FastAPI（202／Location 輪詢、RFC 9457 錯誤格式、Idempotency-Key 冪等、失敗工作狀態），非 root 且固定版本的 Docker 映像與健康檢查，有並行上限、單點失敗不拖垮整批的批次排程與結果彙整表。"
en = "Packaged the tsunami model as an asynchronous, containerised service: FastAPI (202/Location polling, RFC 9457 problem responses, Idempotency-Key semantics, failed-job state), a non-root pinned Docker image with health check, and a bounded-concurrency batch runner whose single-case failures do not stop the batch, with a results table."
interview = "服務重啟時進行中的工作怎麼辦？冪等紀錄放在記憶體裡有什麼問題？"

[[claim]]
id = "M3-falsification"
capability = "M3 生成式 AI 協作與否證"
requires.cards = ["16", "21"]
requires.falsification_mine = 6
zh = "建立 AI 產出否證流程（可檢驗預測 → 獨立驗證 → 紀錄），累積 {falsification_mine} 筆實例，涵蓋數值格式、套件 API 預設值、部署設定與文獻引用錯誤。"
en = "Established a falsification workflow for AI-generated work (testable prediction → independent check → log) with {falsification_mine} documented cases spanning numerical schemes, library defaults, deployment configs and citations."
interview = "舉一個 AI 看起來對但其實錯的例子，你怎麼發現的？"

[[claim]]
id = "M1-verification-suite"
capability = "M1 數值模擬與物理判斷"
requires.lessons = ["01/01", "01/02", "01/03", "01/04"]
zh = "建立數值驗證測試套件：守恆、觀測收斂階、製造解（MMS）、靜水平衡，並以持續整合自動執行。"
en = "Built a numerical verification test suite (conservation, observed order of accuracy, method of manufactured solutions, lake-at-rest) run automatically in CI."
interview = "只有一個網格時你怎麼判斷結果可信？"

[[claim]]
id = "L-capacity-adr"
capability = "M2 自架基礎設施"
requires.cards = ["22", "23", "28"]
zh = "依實測輸出量建立模擬平台的容量模型，估算 10 倍負載時最先耗盡的資源，並撰寫結果儲存的架構決策紀錄（含查證日期與推翻條件）。"
en = "Built a capacity model for the simulation platform from measured output sizes, identified the first resource exhausted at 10x load, and wrote an architecture decision record for result storage with verification dates and reversal conditions."
interview = "資料量成長 10 倍時哪裡先壞？你的 ADR 在什麼條件下會被推翻？"

[[claim]]
id = "L-hybrid-surrogate"
capability = "M1 數值模擬與物理判斷"
requires.cards = ["29", "30", "31"]
zh = "以 COMCOT 批次模擬結果訓練海嘯最大水位代理模型，評估測試集誤差與外插失效，並界定物理模式、簡化公式與代理模型各自的適用情境。"
en = "Trained a surrogate for tsunami maximum water level from batched COMCOT runs, evaluated hold-out error and extrapolation failure, and defined when to use the physics model, simplified formulas or the surrogate."
interview = "代理模型什麼時候不能用？你怎麼讓它自己說「我不知道」？"

[[claim]]
id = "L-wave-pinn-falsification"
capability = "M1 數值模擬與物理判斷"
requires.cards = ["36", "38", "39", "40", "42", "43"]
requires.grill = ["pinn/residual-and-training"]
zh = "以 PyTorch 自行實作淺水方程物理資訊神經網路（PINN）與傅立葉神經算子（FNO）層，用解析解與有限差分強基準量化頻譜偏差、長時間失準與外插失效，並以相同精度下的計算時間公平比較，結論是 PINN 在反問題（由測站反求水深）有優勢、正問題不及傳統求解器。"
en = "Implemented shallow-water physics-informed neural networks (PINNs) and a Fourier neural operator layer in PyTorch; quantified spectral bias, long-horizon drift and extrapolation failure against analytic solutions and a finite-difference baseline, compared wall-clock cost at matched accuracy, and showed PINNs pay off for inverse problems (depth from gauges) but not for forward simulation."
interview = "你怎麼確定你的基準夠強？PINN 什麼時候值得用？FNO 在訓練範圍外失準時，你怎麼讓它自己說「我不知道」？"
