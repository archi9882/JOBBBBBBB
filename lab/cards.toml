predict = "最大水位會變成原本的幾倍？剛好 2 倍、多於 2 倍，還是少於 2 倍？理由是什麼？"
run = ["python lab/tools/run_case.py toy_slip10"]
win = "兩張圖並排，以及一句「為什麼是這個倍數」"
