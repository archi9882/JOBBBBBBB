# 卡片佇列：依序做，一晚一張，每張約 30 分鐘。
# kind：預測（先猜再跑）、偵探（找原因）、拷問（grill-me 小場）、文獻、對決（否證 AI）、
#       實作（你自己寫程式；Claude 只出題與審查，驗收看 check 的測試）
# 規則：先寫下預測才准執行；預測錯了不扣分，錯得越有趣越值得記。
# milestone：做完這張會解鎖的東西（成就感來源）。

