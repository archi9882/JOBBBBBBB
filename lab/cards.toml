# 卡片佇列：依序做，一晚一張，每張約 30 分鐘。
# kind：預測（先猜再跑）、偵探（找原因）、拷問（grill-me 小場）、資料、文獻、對決（否證 AI）、平台
# 規則：先寫下預測才准執行；預測錯了不扣分，錯得越有趣越值得記。
# milestone：做完這張會解鎖的東西（成就感來源）。

[[card]]
id = "01"
kind = "預測"
title = "第一個海嘯"
context = "COMCOT 解球面座標的淺水方程。玩具情境：馬尼拉海溝附近一個 200 km × 80 km 的逆衝斷層，滑移 5 m，合成地形，東北方有一座方形的島。"
predict = "波從震源（119.5E, 20N）傳到島的西南角（121E, 22N）大約要幾分鐘？島的哪一側水位最高？"
run = ["bash lab/tools/setup_comcot.sh", "python lab/tools/run_case.py toy"]
win = "lab/runs/toy/map.png：你的第一張海嘯圖"
milestone = "COMCOT 在你的電腦上跑起來"

