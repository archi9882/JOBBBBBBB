kind = "實作"
title = "自己的最大水位後處理"
context = "COMCOT 每隔 save_every 秒存一張水面 z_01_*.dat，最後還給一張 zmax_layer01.dat。你要自己從快照取最大值，並找出「海岸邊」最高的那一格。"
predict = "你自己從快照算的最大水位，會比 COMCOT 給的 zmax 大、小，還是一樣？差多少？"
spec = "寫 lab/mine/zmax.py：max_over_snapshots(run_dir) 讀所有 z_01_*.dat 逐格取時間最大值（回傳和網格同形狀的陣列）；shoreline_max(h, zmax) 在『鄰接陸地的海格』（上下左右任一格是陸地；h>0 為海、h≤0 為陸）中找最大值，回傳 (值, (j, i))；沒有海岸要 raise ValueError。檔案格式參考 lab/tools/plot.py 的 load()。"
check = "lab/checks/test_c07.py"
hints = [
  "快照是一維文字流，要 reshape 成 (len(y), len(x))。逐張讀進來，用 np.maximum 累積。",
  "海岸格 = 海格 且 上下左右至少一個鄰居是陸地。用布林陣列位移（切片）比用迴圈快也不易寫錯。",
  "land = h <= 0；near = np.zeros_like(land)；near[1:] |= land[:-1]；near[:-1] |= land[1:]；左右同理；mask = ~land & near；np.where(mask, zmax, -np.inf) 再 argmax。",
]
run = ["python lab/tools/card.py check", "python lab/tools/run_case.py toy"]
win = "對 toy 情境跑你的 max_over_snapshots，與 COMCOT 的 zmax 比較，寫出最大差異和原因（快照只有每 600 秒一張）"
milestone = ""

