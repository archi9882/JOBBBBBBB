[[card]]
id = "06"
kind = "實作"
title = "一維走時：波從震源到岸邊要多久"
track = "海嘯"
context = "長波（海嘯）速度是 √(g·h)，水越淺越慢。沿一條水深剖面把 dx/√(g·h) 加起來，就是走時。你現在要自己寫這個最小的海嘯模型，之後拿它檢查 COMCOT。"
predict = "水深 4000 m 的 100 km 外海，走時大約幾分鐘？如果水深線性變淺到 100 m，會比一直 4000 m 多出幾倍？"
spec = "寫 lab/mine/wave1d.py：cumulative_time(h, dx) 回傳每個節點的累積走時（第一個是 0）；travel_time(h, dx) 回傳總走時；h 是各節點水深（m），dx 是間距（m）；水深 ≤ 0 要 raise ValueError。用梯形法，不要用總和當近似。"
check = "lab/checks/test_c06.py"
hints = [
  "波速在每個小區間不是常數：兩端節點的 1/√(g h) 平均一下，再乘 dx，就是這個區間的走時。",
  "先算 c = 1/√(g·h)（慢度）陣列，再 np.cumsum(0.5*(c[1:]+c[:-1])*dx)；累積結果前面補一個 0。",
  "用 np.asarray(h, float)；if np.any(h <= 0): raise ValueError。cumulative_time 回傳 np.concatenate([[0.0], np.cumsum(...)])，travel_time 取它的最後一個。",
]
run = ["python lab/tools/card.py check"]
win = "自己寫的函式和線性變淺解析解吻合；再拿卡 01 的震源到島的走時，和你在卡 01 看到的 COMCOT 到達時間比，說出差在哪（提示：波在 COMCOT 裡走的是二維球面、不是一條直線）"
milestone = "第一段你自己寫的模擬程式"

